<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#0a100e"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.35" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5ee0ae" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5ee0ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#f4b860" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#26332e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glowG)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>

  <!-- Browser with a simple business site -->
  <g transform="translate(110 120)">
    <rect width="560" height="380" rx="18" fill="#131c19" stroke="#2f3f39"/>
    <path d="M0 18a18 18 0 0 1 18-18h524a18 18 0 0 1 18 18v28H0Z" fill="#18231f"/>
    <circle cx="26" cy="23" r="6.5" fill="#ff9d8c"/><circle cx="48" cy="23" r="6.5" fill="#f4b860"/><circle cx="70" cy="23" r="6.5" fill="#5ee0ae"/>
    <rect x="104" y="14" width="300" height="18" rx="9" fill="#0c1311"/>
    <rect x="32" y="78" width="80" height="12" rx="6" fill="#edf3ef" opacity="0.85"/>
    <g fill="#a5b3ac" opacity="0.5"><rect x="282" y="80" width="40" height="8" rx="4"/><rect x="334" y="80" width="40" height="8" rx="4"/><rect x="386" y="80" width="40" height="8" rx="4"/></g>
    <rect x="452" y="72" width="76" height="24" rx="12" fill="#5ee0ae"/>
    <rect x="32" y="130" width="260" height="26" rx="5" fill="#edf3ef" opacity="0.9"/>
    <rect x="32" y="166" width="200" height="26" rx="5" fill="#5ee0ae"/>
    <rect x="32" y="212" width="250" height="10" rx="5" fill="#a5b3ac" opacity="0.5"/>
    <rect x="32" y="232" width="210" height="10" rx="5" fill="#a5b3ac" opacity="0.5"/>
    <rect x="32" y="266" width="130" height="38" rx="19" fill="#5ee0ae"/>
    <rect x="330" y="130" width="198" height="174" rx="12" fill="#1d2b26"/>
    <g fill="#1d2b26"><rect x="32" y="326" width="156" height="30" rx="8"/><rect x="202" y="326" width="156" height="30" rx="8"/><rect x="372" y="326" width="156" height="30" rx="8"/></g>
  </g>

  <!-- Price tag -->
  <g transform="translate(720 150) rotate(-8)">
    <path d="M0 40 L60 0 H330 a20 20 0 0 1 20 20 V200 a20 20 0 0 1 -20 20 H60 L0 180 Z" fill="#f4b860"/>
    <circle cx="44" cy="110" r="14" fill="#0c1311"/>
    <text x="96" y="92" fill="#0c1311" font-size="22" font-weight="700" opacity="0.75">FROM</text>
    <text x="92" y="168" fill="#0c1311" font-size="72" font-weight="700">£695</text>
  </g>

  <!-- Breakdown chips -->
  <g transform="translate(760 430)" font-size="18">
    <rect width="150" height="44" rx="22" fill="#131c19" stroke="#2f3f39"/>
    <circle cx="24" cy="22" r="6" fill="#5ee0ae"/><text x="40" y="28" fill="#edf3ef">pages</text>
    <rect x="166" width="170" height="44" rx="22" fill="#131c19" stroke="#2f3f39"/>
    <circle cx="190" cy="22" r="6" fill="#f4b860"/><text x="206" y="28" fill="#edf3ef">features</text>
    <rect x="58" y="58" width="160" height="44" rx="22" fill="#131c19" stroke="#2f3f39"/>
    <circle cx="82" cy="80" r="6" fill="#84ecc4"/><text x="98" y="86" fill="#edf3ef">design</text>
    <rect x="232" y="58" width="150" height="44" rx="22" fill="#131c19" stroke="#2f3f39"/>
    <circle cx="256" cy="80" r="6" fill="#ff9d8c"/><text x="272" y="86" fill="#edf3ef">content</text>
  </g>
