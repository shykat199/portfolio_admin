<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#0a100e"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.3" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#5ee0ae" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ee0ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.8" r="0.5">
